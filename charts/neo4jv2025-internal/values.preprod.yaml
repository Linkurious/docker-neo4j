# https://github.com/neo4j/helm-charts/blob/dev/neo4j/values.yaml

neo4j:

  securityContext:
    runAsNonRoot: true
    runAsUser: 7474
    runAsGroup: 7474
    fsGroup: 7474
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ['ALL']

  disableLookups: true
  neo4j:
    name: neo4jv2025-internal
    resources:
      requests:
        cpu: 1000m
        memory: "2Gi"
      limits:
        cpu: 2000m
        memory: "2Gi"

    # Uncomment to set the initial password
    # password: "my-initial-password"
    passwordFromSecret: "neo4j-admin-auth"

    # Uncomment to use enterprise edition
    edition: "enterprise"
    acceptLicenseAgreement: "yes"
  config:

    # used to workaround lack of config in helm chart
    DATASETS_JSON: |-
      [
        {
          "name": "aml-2.0.1",
          "neo4j_version": "5.3.0"
        },
        {
          "name": "crunchbase-2.0.0",
          "neo4j_version": "5.3.0"
        },
        {
          "name": "fincrime-2.0.0",
          "neo4j_version": "5.3.0"
        },
        {
          "name": "icij-senzing-3.0.0",
          "neo4j_version": "5.24.21"
        }
      ]

